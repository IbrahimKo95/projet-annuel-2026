services:
  postgres:
    image: postgres:16-alpine
    container_name: lms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-lms_db}
      POSTGRES_USER: ${DB_USER:-lms_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - lms_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-lms_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: lms_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@lms.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    networks:
      - lms_network
    depends_on:
      postgres:
        condition: service_healthy

  nuxt:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lms_nuxt
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${DB_USER:-lms_user}:${DB_PASSWORD:-changeme}@postgres:5432/${DB_NAME:-lms_db}
      NUXT_PUBLIC_API_BASE: ${API_BASE_URL:-http://localhost:3000}
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - /app/.nuxt
    ports:
      - "${NUXT_PORT:-3000}:3000"
    networks:
      - lms_network
    depends_on:
      postgres:
        condition: service_healthy
    command: npm run dev

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
  node_modules:
    driver: local

networks:
  lms_network:
    driver: bridge